name: Build agent releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a manual test build (does not publish a release)"
        required: false
        default: "dev"
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Download dependencies
        run: go mod download

      # Generate certs
      - name: Generate certificates
        run: |
          go run ./tools/generate_cert.go

      # Setup InnoSetup
      - name: Install InnoSetup
        run: |
          choco install innosetup --no-progress --yes
          
      - name: Build Main Service Executable
        run: go build -o NITRINOnetControlManager.exe ./service

      - name: Build Remove Service Executable
        run: go build -o remove_service.exe ./uninstall

      - name: Set version string from tag or input
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "${{ github.event.inputs.version }}" }
          # Строковая версия (может быть с 'v')
          $appVer = $ver
          # Файловая версия: числовая, 4 части (отрезаем всё, кроме цифр и точек)
          $fv = $ver.TrimStart('v')
          $fv = ($fv -replace '[^0-9\.]', '')
          $parts = $fv.Split('.').Where({ $_ -ne '' })
          while ($parts.Length -lt 4) { $parts += '0' }
          if ($parts.Length -gt 4) { $parts = $parts[0..3] }
          $fv4 = [string]::Join('.', $parts)
          if ([string]::IsNullOrWhiteSpace($appVer)) { $appVer = "v0.0.0" }
          if ([string]::IsNullOrWhiteSpace($fv4))    { $fv4 = "0.0.0.0" }
          "APP_VER=$appVer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FILE_VER=$fv4"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build InnoSetup Installer
        shell: cmd
        run: |
          echo APP_VER=%APP_VER%
          echo FILE_VER=%FILE_VER%
          if not "%FILE_VER%"=="" (
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="%APP_VER%" /DMyAppFileVersion="%FILE_VER%" simple_install.iss
          ) else (
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="%APP_VER%" simple_install.iss
          )

      - name: Setup WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix extension add -g WixToolset.Util.wixext/4.0.6
          wix extension add -g WixToolset.Firewall.wixext/4.0.6

      - name: Build enterprise MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix build -arch x64 `
            -ext WixToolset.Util.wixext/4.0.6 `
            -ext WixToolset.Firewall.wixext/4.0.6 `
            -d ProductVersion="$env:FILE_VER" `
            -d AgentExe="$PWD\NITRINOnetControlManager.exe" `
            -o HWMonitorAgent.msi `
            installer\msi\HWMonitorAgent.wxs

      - name: Debug List files in workspace
        run: |
          echo "Current working directory: %cd"
          dir /s /b
        shell: cmd

      - name: Debug Check if installer exists
        run: |
          if exist NITRINOnetControlManagerSetup.exe (
            echo "Installer exists"
          ) else (
            echo "Installer does not exist"
            dir /s /b
            exit 1
          )
        shell: cmd

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: NITRINOnetControlManagerSetup
          path: |
            NITRINOnetControlManagerSetup.exe
            HWMonitorAgent.msi

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Download dependencies and test
        run: |
          go mod download
          GOOS=linux GOARCH=amd64 go test ./...

      - name: Build Linux agent
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/payload
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags='-s -w' \
            -o dist/payload/nitrinonetcmanager ./service
          cp setup_ncm.sh dist/payload/setup_ncm.sh
          cp keys/agent-release-signing-public.pem dist/payload/agent-release-signing-public.pem
          cat > dist/payload/setup.sh <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          # The secret is deliberately not stored in this release. Obtain the
          # panel handshake key from the administrator and pass it at install.
          exec env NCM_AGENT_VERSION="\${NCM_AGENT_VERSION:-${VERSION:-dev}}" \
            bash "\$PWD/setup_ncm.sh" "\$PWD/nitrinonetcmanager" "\${NCM_HANDSHAKE_KEY:-}"
          EOF
          chmod +x dist/payload/setup.sh dist/payload/setup_ncm.sh

      - name: Build self-extracting installer
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself
          makeself dist/payload hw-monitor-agent-linux-amd64.run \
            'HW Monitor Linux Agent (amd64)' ./setup.sh

      - name: Upload Linux installer
        uses: actions/upload-artifact@v6
        with:
          name: hw-monitor-agent-linux-amd64
          path: hw-monitor-agent-linux-amd64.run

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AGENT_RELEASE_SIGNING_KEY: ${{ secrets.AGENT_RELEASE_SIGNING_KEY }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Create manifest and checksums
        working-directory: release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          windows_file=NITRINOnetControlManagerSetup.exe
          windows_msi_file=HWMonitorAgent.msi
          linux_file=hw-monitor-agent-linux-amd64.run
          windows_sha=$(sha256sum "$windows_file" | awk '{print $1}')
          windows_msi_sha=$(sha256sum "$windows_msi_file" | awk '{print $1}')
          linux_sha=$(sha256sum "$linux_file" | awk '{print $1}')
          cat > manifest.json <<EOF
          {"agents":[
            {"id":"windows-amd64","platform":"windows","architecture":"amd64","version":"${VERSION}","file":"${windows_file}","sha256":"${windows_sha}","installer":"${windows_file}"},
            {"id":"windows-amd64-msi","platform":"windows","architecture":"amd64","version":"${VERSION}","kind":"enterprise-msi","file":"${windows_msi_file}","sha256":"${windows_msi_sha}","installer":"msiexec /i ${windows_msi_file} /qn NCM_HANDSHAKE_KEY='<ключ панели>'"},
            {"id":"linux-amd64","platform":"linux","architecture":"amd64","version":"${VERSION}","file":"${linux_file}","sha256":"${linux_sha}","installer":"sudo env NCM_HANDSHAKE_KEY='<ключ панели>' ./${linux_file}"}
          ]}
          EOF
          test -n "$AGENT_RELEASE_SIGNING_KEY"
          umask 077
          printf '%s' "$AGENT_RELEASE_SIGNING_KEY" > agent-release-signing.key
          openssl pkeyutl -sign -rawin -inkey agent-release-signing.key \
            -in manifest.json -out manifest.signature
          payload=$(base64 -w 0 manifest.json)
          signature=$(base64 -w 0 manifest.signature)
          printf '{"schema_version":1,"payload":"%s","signature":"%s"}\n' \
            "$payload" "$signature" > manifest.envelope.json
          rm -f agent-release-signing.key manifest.signature
          sha256sum "$windows_file" "$windows_msi_file" "$linux_file" manifest.json manifest.envelope.json > SHA256SUMS

      - name: Bundle agents for panel installation
        working-directory: release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          tar -czf "hw-monitor-agents-${VERSION}.tar.gz" \
            NITRINOnetControlManagerSetup.exe \
            HWMonitorAgent.msi \
            hw-monitor-agent-linux-amd64.run \
            manifest.json \
            manifest.envelope.json \
            SHA256SUMS
          sha256sum "hw-monitor-agents-${VERSION}.tar.gz" >> SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/NITRINOnetControlManagerSetup.exe
            release/HWMonitorAgent.msi
            release/hw-monitor-agent-linux-amd64.run
            release/manifest.json
            release/manifest.envelope.json
            release/SHA256SUMS
            release/hw-monitor-agents-*.tar.gz

  deploy-release-host:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_HOST: ${{ secrets.RELEASE_HOST }}
      RELEASE_USER: ${{ secrets.RELEASE_USER }}
      RELEASE_PORT: ${{ secrets.RELEASE_PORT }}
      RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
      RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.RELEASE_SSH_KNOWN_HOSTS }}
      RELEASE_TARGET_DIR: ${{ secrets.RELEASE_TARGET_DIR }}
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Skip when release host is not configured
        if: env.RELEASE_HOST == '' || env.RELEASE_USER == '' || env.RELEASE_PORT == '' || env.RELEASE_SSH_KEY == '' || env.RELEASE_SSH_KNOWN_HOSTS == '' || env.RELEASE_TARGET_DIR == ''
        run: echo 'Release host secrets are not configured; skipping deployment.'

      - name: Download published release files
        if: env.RELEASE_HOST != '' && env.RELEASE_USER != '' && env.RELEASE_PORT != '' && env.RELEASE_SSH_KEY != '' && env.RELEASE_SSH_KNOWN_HOSTS != '' && env.RELEASE_TARGET_DIR != ''
        run: |
          mkdir -p release-host-payload
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir release-host-payload

      - name: Configure SSH
        if: env.RELEASE_HOST != '' && env.RELEASE_USER != '' && env.RELEASE_PORT != '' && env.RELEASE_SSH_KEY != '' && env.RELEASE_SSH_KNOWN_HOSTS != '' && env.RELEASE_TARGET_DIR != ''
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RELEASE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$RELEASE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Resolve distribution channel
        if: env.RELEASE_HOST != '' && env.RELEASE_USER != '' && env.RELEASE_PORT != '' && env.RELEASE_SSH_KEY != '' && env.RELEASE_SSH_KNOWN_HOSTS != '' && env.RELEASE_TARGET_DIR != ''
        shell: bash
        run: |
          case "$VERSION" in
            *-test.*|*-rc.*) echo 'RELEASE_CHANNEL=test' >> "$GITHUB_ENV" ;;
            *) echo 'RELEASE_CHANNEL=stable' >> "$GITHUB_ENV" ;;
          esac

      - name: Upload release atomically
        if: env.RELEASE_HOST != '' && env.RELEASE_USER != '' && env.RELEASE_PORT != '' && env.RELEASE_SSH_KEY != '' && env.RELEASE_SSH_KNOWN_HOSTS != '' && env.RELEASE_TARGET_DIR != ''
        run: |
          remote_root="${RELEASE_TARGET_DIR%/}/agents"
          remote_base="${remote_root}/${RELEASE_CHANNEL}"
          remote_stage="${remote_base}/.staging-${VERSION}"
          remote_version="${remote_base}/${VERSION}"
          ssh -p "$RELEASE_PORT" "$RELEASE_USER@$RELEASE_HOST" "mkdir -p '$remote_stage'"
          scp -P "$RELEASE_PORT" release-host-payload/* "$RELEASE_USER@$RELEASE_HOST:$remote_stage/"
          ssh -p "$RELEASE_PORT" "$RELEASE_USER@$RELEASE_HOST" "set -eu; test -f '$remote_stage/manifest.json'; test -f '$remote_stage/manifest.envelope.json'; test -f '$remote_stage/SHA256SUMS'; test -f '$remote_stage/hw-monitor-agents-${VERSION}.tar.gz'; test ! -e '$remote_version'; mv '$remote_stage' '$remote_version'; ln -sfn '$VERSION' '$remote_base/current'; ln -sfn 'current/hw-monitor-agents-${VERSION}.tar.gz' '$remote_base/hw-monitor-agents-latest.tar.gz'; ln -sfn 'current/manifest.json' '$remote_base/manifest.json'; ln -sfn 'current/manifest.envelope.json' '$remote_base/manifest.envelope.json'; ln -sfn 'current/SHA256SUMS' '$remote_base/SHA256SUMS'; if [ '$RELEASE_CHANNEL' = stable ]; then ln -sfn 'stable/current' '$remote_root/current'; ln -sfn 'stable/current/hw-monitor-agents-${VERSION}.tar.gz' '$remote_root/hw-monitor-agents-latest.tar.gz'; ln -sfn 'stable/manifest.json' '$remote_root/manifest.json'; ln -sfn 'stable/current/manifest.envelope.json' '$remote_root/manifest.envelope.json'; ln -sfn 'stable/SHA256SUMS' '$remote_root/SHA256SUMS'; fi"
